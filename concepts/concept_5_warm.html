<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이파크 파트너스 200 제안 (따뜻한 신뢰)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 컨셉 5: 따뜻한 신뢰, 시니어 친화
     오트 베이지 바탕, 세이지 그린과 짙은 갈색 글자, 황토색 포인트.
     큰 글자, 넉넉한 줄 간격, 둥근 큰 버튼, 한 화면에 한 가지 메시지. */
  :root{
    --bg:#FAF7F2; --bg2:#F2EBE0; --card:#FFFDF9; --line:#E2D8C8; --line2:#D3C6B2;
    --ink:#3A2E24; --muted:#5C4E41;
    --sage:#3F5E3D; --sage2:#4A6B48; --sage-soft:#E6EDE2; --sage-line:#BFCDB9;
    --ochre:#C08A3E; --ochre-ink:#85571A; --ochre-soft:#F5E9D3;
    --old:#BCAE9A;
    --r:20px;
    --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mpc-fg:var(--ink); --mpc-muted:var(--muted); --mpc-card:var(--card); --mpc-line:var(--line2);
    --mpc-accent:var(--sage); --mpc-accent-fg:#fff; --mpc-hero-bg:var(--sage); --mpc-hero-fg:#fff;
    --mpc-radius:20px; --mpc-font:var(--font)
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.8;
    word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  h1,h2,h3{color:var(--ink);letter-spacing:-.02em;margin:0}
  p{margin:0}
  ul{margin:0;padding:0;list-style:none}
  a{color:inherit}
  :focus-visible{outline:4px solid var(--ochre-ink);outline-offset:4px;border-radius:12px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px}
  .narrow{max-width:800px}

  /* 머리글 */
  .top{background:var(--bg);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;min-height:84px;padding-top:12px;padding-bottom:12px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.05rem;color:var(--sage)}
  .brand i{display:block;width:34px;height:34px;border-radius:50%;background:var(--sage);position:relative;flex:none}
  .brand i::after{content:"";position:absolute;left:9px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}

  /* 버튼 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:0 34px;border-radius:999px;
    background:var(--sage);color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;border:3px solid var(--sage);text-align:center;line-height:1.35}
  .btn:hover{background:#334D31;border-color:#334D31}
  .btn.ghost{background:transparent;color:var(--sage)}
  .btn.ghost:hover{background:var(--sage-soft)}
  .btn.small{min-height:56px;padding:0 24px;font-size:1rem}
  .btns{display:flex;flex-wrap:wrap;gap:16px}

  /* 구역 공통 */
  section{padding:104px 0;--sbg:var(--bg)}
  section.alt{background:var(--bg2);--sbg:var(--bg2)}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;color:var(--ochre-ink);margin-bottom:18px}
  .kicker::before{content:"";width:28px;height:4px;border-radius:4px;background:var(--ochre)}
  h2{font-size:clamp(1.85rem,4.2vw,2.6rem);line-height:1.4;font-weight:800;max-width:24em}
  .lead{font-size:1.15rem;color:var(--muted);margin-top:22px;max-width:40em;line-height:1.85}
  .foot{color:var(--muted);font-size:1rem;line-height:1.75;margin-top:24px;max-width:52em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px}

  /* 히어로 */
  .hero{padding:88px 0 104px}
  .badge{display:inline-block;background:var(--ochre-soft);color:var(--ochre-ink);border:2px solid #E3C99A;font-weight:800;font-size:1.05rem;padding:8px 22px;border-radius:999px}
  .hero h1{font-size:clamp(2.1rem,5.6vw,3.6rem);line-height:1.32;font-weight:800;margin-top:28px;max-width:15em}
  .hero .sub{font-size:clamp(1.15rem,2.2vw,1.35rem);color:var(--muted);margin-top:26px;max-width:34em;line-height:1.85}
  .hero .btns{margin-top:40px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:72px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px 28px;display:flex;flex-direction:column;gap:6px;position:relative}
  .stat::before{content:"";position:absolute;left:28px;top:0;width:48px;height:5px;border-radius:0 0 5px 5px;background:var(--ochre)}
  .stat .l{font-weight:700;font-size:1.05rem;color:var(--muted)}
  .stat .v{font-weight:800;font-size:clamp(2rem,2.9vw,2.4rem);white-space:nowrap;line-height:1.25;color:var(--sage);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .n{font-size:1rem;color:var(--muted);line-height:1.6}

  /* 표 */
  .tablewrap{margin-top:44px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table{border-collapse:collapse;width:100%}
  th,td{padding:20px 24px;text-align:left;border-top:1px solid var(--line);vertical-align:middle;font-size:1.05rem;line-height:1.55}
  thead th{border-top:0;background:#EFE6D8;color:var(--ink);font-weight:800;font-size:1rem}
  tbody th{font-weight:700}
  td{font-variant-numeric:tabular-nums;font-weight:600}
  .t-compare td:nth-child(3),.t-compare thead th:nth-child(3){background:var(--sage-soft)}
  .t-compare td:nth-child(3){color:var(--sage);font-weight:800}
  .t-compare td:nth-child(4){color:var(--ochre-ink);font-weight:800}
  .t-compare tr.key th,.t-compare tr.key td{font-size:1.2rem;font-weight:800}
  .t-payback td.hl{color:var(--sage);font-weight:800}

  /* 비교: 차이 강조 */
  .save{margin-top:44px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;background:var(--card);border:2px solid #E3C99A;border-radius:var(--r);padding:28px 32px}
  .save .l{font-weight:800;font-size:1.15rem;color:var(--ochre-ink)}
  .save .v{font-weight:800;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.2;color:var(--ochre-ink);letter-spacing:-.02em}

  /* 회수 기간 막대 */
  .chart{margin-top:44px;display:grid;gap:12px}
  .legend{display:flex;flex-wrap:wrap;gap:12px 28px;font-weight:700;font-size:1.05rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:10px}
  .legend i{display:inline-block;width:26px;height:16px;border-radius:5px;background:var(--sage2)}
  .legend i.old{background:var(--old)}
  .grp{padding:26px 0;border-top:1px solid var(--line)}
  .grp:first-of-type{border-top:0}
  .grp h3{font-size:1.25rem;font-weight:800;margin-bottom:14px}
  .bar{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:16px;margin:10px 0}
  .bar .who{font-weight:700;font-size:1.05rem;color:var(--muted)}
  .bar .track{display:flex;align-items:center;gap:16px;min-width:0}
  .bar i{display:block;height:40px;border-radius:12px;background:var(--sage2);flex:none;width:calc((100% - var(--res,8.5rem)) * var(--r))}
  .bar.old i{background:var(--old)}
  .bar b{font-size:1.6rem;font-weight:800;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--sage)}
  .bar.old b{color:var(--muted);font-size:1.4rem}
  .points{margin-top:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .points li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;font-size:1.05rem;line-height:1.8;position:relative;padding-top:44px}
  .points li::before{content:"";position:absolute;left:28px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--ochre)}
  .points li:last-child{border:2px solid #E3C99A;background:#FFFBF2}

  /* 과금 방식 */
  .bill{margin-top:48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  .bill li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:36px 34px 34px;position:relative;display:flex;flex-direction:column;gap:14px}
  .bill li::before{content:"";position:absolute;left:34px;top:0;width:64px;height:6px;border-radius:0 0 6px 6px;background:var(--ochre)}
  .bill h3{font-size:clamp(1.5rem,3vw,1.95rem);font-weight:800;line-height:1.4;color:var(--sage)}
  .bill p{font-size:1.1rem;line-height:1.85;color:var(--ink)}
  .bill li:first-child{border:2px solid var(--sage-line);background:#FBFDF9}

  /* 상생 흐름 */
  .flow{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;position:relative;counter-reset:none}
  .flow::before{content:"";position:absolute;top:44px;left:16.66%;right:16.66%;height:6px;border-radius:6px;background:var(--sage-line)}
  .step{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 8px}
  .step .num{width:94px;height:94px;border-radius:50%;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:2.4rem;font-weight:800;box-shadow:0 0 0 10px var(--sbg);position:relative}
  .step .tag{margin-top:14px;font-weight:800;font-size:1rem;color:var(--ochre-ink)}
  .step h3{font-size:1.4rem;font-weight:800;line-height:1.4}
  .step p{color:var(--muted);font-size:1.05rem;max-width:15em}
  .duo{margin-top:72px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  .duo h3,.support h3{font-size:1.35rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .duo h3::before,.support h3::before{content:"";width:12px;height:30px;border-radius:6px;background:var(--sage2);flex:none}
  .duo .hq h3::before{background:var(--ochre)}
  .ticks li{position:relative;padding:14px 0 14px 40px;border-top:1px solid var(--line);font-size:1.05rem;line-height:1.7}
  .ticks li:first-child{border-top:0}
  .ticks li::before{content:"";position:absolute;left:4px;top:24px;width:18px;height:10px;border-left:4px solid var(--sage2);border-bottom:4px solid var(--sage2);transform:rotate(-45deg)}
  .support{margin-top:24px}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .tiles li{background:var(--sage-soft);border-radius:16px;padding:22px 20px;font-weight:700;font-size:1.05rem;line-height:1.6;color:var(--ink);display:flex;align-items:center}
  .trust{margin-top:40px;padding:28px 32px;border-left:8px solid var(--ochre);background:var(--card);border-radius:0 var(--r) var(--r) 0;font-size:1.15rem;line-height:1.85;color:var(--ink);font-weight:600}

  /* 200대 한정 */
  .ex-title{margin-top:72px;font-size:clamp(1.35rem,3vw,1.75rem);font-weight:800;line-height:1.45}
  .examples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px 28px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .ex .l{font-weight:800;font-size:1.15rem;color:var(--ink);background:var(--ochre-soft);padding:2px 16px;border-radius:999px}
  .ex .v{font-weight:800;font-size:clamp(2.1rem,4vw,2.8rem);line-height:1.3;color:var(--sage);margin-top:12px;letter-spacing:-.02em}
  .ex .n{font-weight:700;font-size:1.05rem;color:var(--muted)}
  .t-limited td:nth-child(2),.t-limited thead th:nth-child(2){background:var(--sage-soft)}
  .t-limited td:nth-child(2){color:var(--sage);font-weight:800}

  /* 계산기 */
  .calcbox{margin-top:44px;padding:40px}
  #mp-calc .mpc{font-size:19px;line-height:1.7;gap:28px}
  #mp-calc .mpc__label{font-size:1.05rem;color:var(--muted)}
  #mp-calc .mpc__chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  #mp-calc .mpc__chip{min-height:64px;min-width:0;font-size:1.25rem;padding:0 8px;border-width:2px;background:var(--card)}
  #mp-calc .mpc__chip--on{background:var(--sage);border-color:var(--sage);color:#fff;box-shadow:0 0 0 4px var(--sage-soft)}
  #mp-calc .mpc__stepper{gap:12px}
  #mp-calc .mpc__stepper span.t{font-size:1.05rem}
  #mp-calc .mpc__stepper button{width:60px;height:60px;border-radius:999px;font-size:1.6rem}
  #mp-calc .mpc__stepper input{width:110px;height:60px;border-radius:16px;font-size:1.4rem}
  #mp-calc .mpc__hero{padding:30px 32px;gap:8px;container-type:inline-size}
  #mp-calc .mpc__hero-label{font-size:1.1rem;opacity:1}
  #mp-calc .mpc__hero-value{font-size:clamp(2.5rem,14cqi,4.4rem);line-height:1.2;overflow-wrap:normal}
  #mp-calc .mpc__hero-sub{font-size:1.05rem;opacity:1}
  #mp-calc .mpc__row{padding:16px 22px}
  #mp-calc .mpc__row dt{font-size:1.02rem}
  #mp-calc .mpc__row dd{font-size:1.2rem}
  #mp-calc .mpc__row small{font-size:.95rem}
  #mp-calc .mpc__save2{font-size:1.1rem;color:var(--ochre-ink);background:var(--ochre-soft);border-radius:16px;padding:16px 20px;line-height:1.7}
  #mp-calc .mpc__store{border-top:2px solid var(--line);padding-top:28px;gap:16px}
  #mp-calc .mpc__store-title{font-size:1.35rem}
  #mp-calc .mpc__seg{border-width:2px}
  #mp-calc .mpc__seg-btn{min-height:60px;padding:0 28px;font-size:1.15rem}
  #mp-calc .mpc__note{font-size:1rem;line-height:1.75}
  @media (min-width:1000px){
    #mp-calc .mpc{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;align-items:start}
    #mp-calc .mpc__group,#mp-calc .mpc__note{grid-column:1/-1}
    #mp-calc .mpc__store{border-top:0;padding-top:0;border-left:2px solid var(--line);padding-left:40px}
  }

  /* 계산 기준 */
  .basis-list{margin-top:40px;padding:12px 32px}
  .basis-list li{padding:18px 0 18px 34px;border-top:1px solid var(--line);font-size:1.02rem;line-height:1.8;position:relative}
  .basis-list li:first-child{border-top:0}
  .basis-list li::before{content:"";position:absolute;left:4px;top:30px;width:10px;height:10px;border-radius:50%;background:var(--sage2)}
  .notice{margin-top:28px;background:var(--ochre-soft);border-radius:var(--r);padding:26px 30px;font-size:1rem;line-height:1.85;color:var(--ink)}
  .notice p+p{margin-top:12px}

  /* 상담 */
  .contact{background:var(--sage);color:#fff}
  .contact h2{color:#fff}
  .contact .lead{color:#fff;opacity:1}
  .contact .btns{margin-top:44px}
  .contact .btn{background:#fff;color:var(--sage);border-color:#fff;min-height:72px;font-size:1.25rem;padding:0 36px}
  .contact .btn:hover{background:var(--bg)}
  .contact .btn{flex-wrap:wrap;column-gap:.4em;row-gap:0}
  .contact .btn .u{white-space:nowrap}
  .contact .btn.ghost{background:transparent;color:#fff}
  .contact .btn.ghost:hover{background:#355033}
  .contact :focus-visible{outline-color:#F5E9D3}

  footer{padding:40px 0 56px;color:var(--muted);font-size:1rem;background:var(--bg)}

  @media (max-width:1040px){.stats{grid-template-columns:minmax(0,1fr)}}
  /* 태블릿 */
  @media (max-width:900px){
    .stats,.examples{grid-template-columns:minmax(0,1fr)}
    .stat,.ex{flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:16px}
    .stat .l,.ex .l{flex-basis:100%}
    .ex .l{flex-basis:auto}
    .ex .v{flex-basis:100%;margin-top:8px}
    .points{grid-template-columns:minmax(0,1fr)}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bill{grid-template-columns:minmax(0,1fr)}
    #mp-calc .mpc__chips{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  /* 휴대폰 */
  @media (max-width:720px){
    body{font-size:19px}
    .wrap{padding:0 20px}
    section{padding:72px 0}
    .hero{padding:56px 0 72px}
    .stats{margin-top:48px}
    .card{padding:24px 22px}
    .btns .btn{width:100%}
    .top .wrap{min-height:72px}
    .brand{font-size:1rem}
    .duo{grid-template-columns:minmax(0,1fr)}
    .tiles{grid-template-columns:minmax(0,1fr)}
    .bill{margin-top:36px;gap:18px}
    .bill li{padding:30px 22px 26px}
    .bill li::before{left:22px}
    .save{padding:24px 22px}
    .trust{padding:22px 22px}
    /* 표를 카드로 쌓기 */
    .tablewrap{background:transparent;border:0;border-radius:0;overflow:visible}
    .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap th,.tablewrap td{display:block;width:100%}
    .tablewrap thead{display:none}
    .tablewrap tr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
    .tablewrap tr:first-child{margin-top:0}
    .tablewrap tbody th{border-top:0;background:#EFE6D8;font-size:1.15rem;padding:16px 20px}
    .tablewrap td{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:14px 20px;text-align:right;background:transparent !important}
    .tablewrap td::before{content:attr(data-label);text-align:left;font-weight:600;color:var(--muted);font-size:1rem}
    .t-compare tr.key{border:2px solid #E3C99A}
    .chart{margin-top:32px}
    .bar{grid-template-columns:minmax(0,1fr);gap:6px;margin:14px 0}
    .bar{--res:7.4rem}
    .bar b{font-size:1.45rem}
    .top .btn{display:none}
    .bar.old b{font-size:1.25rem}
    .flow{grid-template-columns:minmax(0,1fr);gap:0;margin-top:40px}
    .flow::before{top:40px;bottom:40px;left:39px;right:auto;width:6px;height:auto}
    .step{display:grid;grid-template-columns:80px minmax(0,1fr);text-align:left;align-items:start;column-gap:20px;row-gap:2px;padding:0 0 32px}
    .step:last-child{padding-bottom:0}
    .step .num{width:80px;height:80px;font-size:2rem;grid-row:1/4;box-shadow:0 0 0 8px var(--sbg)}
    .step .tag{margin-top:6px}
    .step p{max-width:none}
    .calcbox{padding:24px 18px;margin-top:32px}
    #mp-calc .mpc__chip{min-height:60px;font-size:1.15rem}
    #mp-calc .mpc__hero{padding:22px 20px}
    #mp-calc .mpc__stepper span.t:first-child{flex-basis:100%}
    #mp-calc .mpc__stepper button{width:56px;height:56px}
    #mp-calc .mpc__stepper input{width:96px;height:56px}
    #mp-calc .mpc__row{grid-template-columns:minmax(0,1fr);padding:14px 18px}
    #mp-calc .mpc__row dd{text-align:left;font-size:1.3rem}
    #mp-calc .mpc__seg{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    #mp-calc .mpc__seg-btn{padding:0 8px}
    .basis-list{padding:6px 22px}
    .notice{padding:22px}
    .contact .btn{font-size:1.15rem;padding:10px 20px}
  }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F7A5C'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i><strong data-bind="brand"></strong></div>
    <a class="btn ghost small" href="#contact" data-bind="hero.ctaSecondary"></a>
  </div>
</header>

<main>
<section class="hero" id="top">
  <div class="wrap">
    <span class="badge" data-bind="hero.badge"></span>
    <h1 data-bind="hero.title"></h1>
    <p class="sub" data-bind="hero.sub"></p>
    <div class="btns">
      <a class="btn" href="#calc" data-bind="hero.ctaPrimary"></a>
      <a class="btn ghost" href="#contact" data-bind="hero.ctaSecondary"></a>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section class="alt" id="compare">
  <div class="wrap">
    <h2 data-bind="compare.title"></h2>
    <p class="lead" data-bind="compare.lead"></p>
    <div class="save"><span class="l" data-bind="compare.saveLabel"></span><span class="v" data-bind="compare.saveValue"></span></div>
    <div class="tablewrap"><table class="t-compare" id="t-compare"></table></div>
    <p class="foot" data-bind="compare.foot"></p>
  </div>
</section>

<section id="payback">
  <div class="wrap">
    <h2 data-bind="payback.title"></h2>
    <p class="lead" data-bind="payback.lead"></p>
    <div class="card chart">
      <div class="legend" aria-hidden="true"><span><i class="old"></i>일시불</span><span><i></i>파트너스</span></div>
      <div id="bars"></div>
    </div>
    <ul class="points" id="points"></ul>
    <div class="tablewrap"><table class="t-payback" id="t-payback"></table></div>
    <p class="foot" data-bind="payback.foot"></p>
  </div>
</section>

<section class="alt" id="billing">
  <div class="wrap">
    <h2 data-bind="billing.title"></h2>
    <p class="lead" data-bind="billing.lead"></p>
    <ul class="bill" id="bill"></ul>
  </div>
</section>

<section id="partners">
  <div class="wrap">
    <h2 data-bind="partnership.title"></h2>
    <p class="lead" data-bind="partnership.lead"></p>
    <ol class="flow" id="steps" style="list-style:none;padding:0;margin-left:0;margin-right:0;margin-bottom:0"></ol>
    <div class="duo">
      <div class="card owner"><h3 data-bind="partnership.owner.title"></h3><ul class="ticks" id="owner"></ul></div>
      <div class="card hq"><h3 data-bind="partnership.hq.title"></h3><ul class="ticks" id="hq"></ul></div>
    </div>
    <div class="card support"><h3 data-bind="partnership.support.title"></h3><ul class="tiles" id="support"></ul></div>
    <p class="trust" data-bind="partnership.trust"></p>
  </div>
</section>

<section class="alt" id="limited">
  <div class="wrap">
    <span class="badge" data-bind="hero.badge"></span>
    <h2 data-bind="limited.title" style="margin-top:24px"></h2>
    <p class="lead" data-bind="limited.lead"></p>
    <div class="tablewrap"><table class="t-limited" id="t-limited"></table></div>
    <h3 class="ex-title" data-bind="limited.examplesTitle"></h3>
    <div class="examples" id="examples"></div>
    <p class="foot" data-bind="limited.note"></p>
  </div>
</section>

<section id="calc">
  <div class="wrap">
    <h2 data-bind="calc.title"></h2>
    <p class="lead" data-bind="calc.lead"></p>
    <div class="card calcbox"><div id="mp-calc"></div></div>
  </div>
</section>

<section class="alt" id="basis">
  <div class="wrap">
    <h2 data-bind="basis.title"></h2>
    <p class="lead" data-bind="basis.lead"></p>
    <ul class="card basis-list" id="basis-items"></ul>
    <div class="notice" id="notice"></div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <h2 data-bind="cta.title"></h2>
    <p class="lead" data-bind="cta.body"></p>
    <div class="btns">
      <a class="btn" id="cta-tel"></a>
      <a class="btn ghost" id="cta-site"></a>
    </div>
  </div>
</section>
</main>
<footer><div class="wrap" data-bind="footer"></div></footer>

<script src="../shared/model.js"></script>
<script src="../shared/content.js"></script>
<script src="../shared/widget.js"></script>
<script>
(function () {
  var C = MP.copyR, T = MP.TABLES, F = MP.fmt;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  // 표: 휴대폰에서는 카드로 쌓이므로 칸마다 머리글을 data-label 로 붙인다
  function table(el, headers, rows, rowClass) {
    var h = '<thead><tr>' + headers.map(function (x) { return '<th scope="col">' + esc(x) + '</th>'; }).join('') + '</tr></thead>';
    var b = '<tbody>' + rows.map(function (r, ri) {
      var cls = rowClass ? rowClass(r, ri) : '';
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + r.map(function (x, i) {
        if (i === 0) return '<th scope="row">' + esc(x) + '</th>';
        var c = (typeof x === 'object') ? x : { v: x };
        return '<td data-label="' + esc(headers[i]) + '"' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + esc(c.v) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
    el.innerHTML = h + b;
  }
  function list(el, items) { el.innerHTML = items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); }

  MP.bind();

  // 히어로 핵심 숫자 3개
  $('stats').innerHTML = C.stats.map(function (s) {
    return '<div class="stat"><span class="l">' + esc(s.label) + '</span><span class="v">' + esc(s.value) + '</span><span class="n">' + esc(s.note) + '</span></div>';
  }).join('');

  // 같은 조건 비교 표 (총 창업 비용 줄 강조)
  table($('t-compare'), C.compare.headers, T.compare, function (r) { return r[0] === '총 창업 비용' ? 'key' : ''; });

  // 회수 기간 막대: 가장 긴 값을 막대 칸 100%로, 값 라벨 자리는 남겨 둔다
  var max = Math.max.apply(null, T.payback.map(function (r) { return r.bepLegacy; }));
  function bar(cls, who, v) {
    var ratio = (v / max).toFixed(4);
    return '<div class="bar' + cls + '"><span class="who">' + who + '</span><div class="track">' +
      '<i style="--r:' + ratio + '" aria-hidden="true"></i><b>' + F.months(v) + '</b></div></div>';
  }
  $('bars').innerHTML = T.payback.map(function (r) {
    return '<div class="grp"><h3>' + r.turns + '회전</h3>' + bar(' old', '일시불', r.bepLegacy) + bar('', '파트너스', r.bepNew) + '</div>';
  }).join('');
  list($('points'), C.payback.points);
  table($('t-payback'), C.payback.headers, T.payback.map(function (r) {
    return [r.turns + '회전', F.man(r.revenue), { v: F.man(r.profitNew) }, { v: F.months(r.bepNew), cls: 'hl' }, F.months(r.bepLegacy), { v: F.pct(r.roiNew), cls: 'hl' }];
  }));

  // 과금 방식 4가지
  $('bill').innerHTML = C.billing.items.map(function (x) {
    return '<li><h3>' + esc(x.title) + '</h3><p>' + esc(x.body) + '</p></li>';
  }).join('');

  // 상생 구조 3단계 흐름
  $('steps').innerHTML = C.partnership.steps.map(function (s, i) {
    return '<li class="step"><span class="num" aria-hidden="true">' + (i + 1) + '</span><span class="tag">' + (i + 1) + '단계</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p></li>';
  }).join('');
  list($('owner'), C.partnership.owner.items);
  list($('hq'), C.partnership.hq.items);
  list($('support'), C.partnership.support.items);

  // 200대 한정
  table($('t-limited'), C.limited.headers, C.limited.rows);
  $('examples').innerHTML = [8, 10, 20].map(function (n) {
    return '<div class="ex"><span class="l">' + n + '대 구매</span><span class="v">' + F.man(MP.discount(n).saveVsAfter) + '</span><span class="n">할인</span></div>';
  }).join('');

  // 계산 기준과 법적 고지
  list($('basis-items'), C.basis.items);
  $('notice').innerHTML = C.basis.notice.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('');

  // 상담
  // 버튼 안 줄바꿈이 주소 중간에서 일어나지 않도록 라벨과 값을 나눠 담는다
  $('cta-tel').innerHTML = '<span>' + esc(C.cta.phoneLabel) + '</span> <span class="u">' + esc(MP.contact.phone) + '</span>'; $('cta-tel').href = MP.contact.tel;
  $('cta-site').innerHTML = '<span>' + esc(C.cta.siteLabel) + '</span> <span class="u">' + esc(MP.contact.site) + '</span>'; $('cta-site').href = MP.contact.url;

  MP.mountCalc($('mp-calc'));
})();
</script>
</body>
</html>
