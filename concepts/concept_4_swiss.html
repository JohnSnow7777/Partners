<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이파크 파트너스 200 제안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 컨셉 4: 스위스 타이포그래피. 흰 바탕, 검정 글자, 포인트 색 하나(에메랄드). 글자와 선과 숫자로만 구성 */
  :root{
    --ink:#0A0A0A; --mute:#454545; --hair:#0A0A0A; --soft:#C9C9C9; --bg:#FFFFFF;
    --acc:#0F7A5C; --accfg:#FFFFFF;
    --pad:clamp(16px,4vw,48px); --gap:clamp(12px,2vw,24px);
    --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mpc-fg:var(--ink); --mpc-muted:var(--mute); --mpc-bg:#fff; --mpc-card:#fff; --mpc-line:var(--ink);
    --mpc-accent:var(--acc); --mpc-accent-fg:var(--accfg); --mpc-hero-bg:#fff; --mpc-hero-fg:var(--ink);
    --mpc-radius:0; --mpc-font:var(--font); --mpc-num-font:var(--font);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 var(--font);word-break:keep-all;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
  h1,h2,h3,p,ul,ol{margin:0}
  ul,ol{padding:0;list-style:none}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--acc);outline-offset:3px}

  .wrap{max-width:1280px;margin:0 auto;padding:0 var(--pad)}
  .g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}
  .g>*{grid-column:1/-1;min-width:0}

  /* 버튼: 모서리 없는 사각형 */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;font-weight:700;font-size:19px;text-decoration:none;border:2px solid var(--ink);background:#fff;color:var(--ink);line-height:1.3;text-align:center}
  .btn--acc{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
  @media (prefers-reduced-motion:no-preference){.btn{transition:background-color .15s,color .15s}}
  .btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 머리글 */
  .top__in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:6px solid var(--ink)}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
  .top .btn{min-height:48px;font-size:17px;padding:0 18px}

  /* 히어로 */
  .hero{padding-top:clamp(28px,5vw,64px)}
  .badge{display:inline-block;background:var(--acc);color:var(--accfg);font-weight:700;font-size:17px;padding:6px 14px;justify-self:start}
  .hero h1{margin-top:22px;font-size:clamp(2rem,5vw,4.4rem);line-height:1.14;font-weight:800;letter-spacing:-.035em}
  .hero__big{margin-top:clamp(32px,5vw,64px);border-top:2px solid var(--ink);padding-top:14px}
  .hero__biglabel{font-weight:700;font-size:19px}
  .hero__bignum{font-size:clamp(3.1rem,14vw,11rem);font-weight:800;line-height:1.16;letter-spacing:-.045em;color:var(--acc);margin-top:0}
  .hero__row{margin-top:clamp(24px,3vw,40px);row-gap:24px;align-items:end}
  .hero__sub{font-size:clamp(19px,1.7vw,22px);line-height:1.6}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .stats{margin-top:clamp(40px,5vw,72px);row-gap:0}
  .stat{border-top:6px solid var(--ink);padding:14px 0 22px}
  .stat__label{font-weight:700;font-size:18px}
  .stat__value{display:block;font-size:clamp(2.2rem,4.6vw,3.8rem);font-weight:800;line-height:1.08;letter-spacing:-.035em;margin:6px 0 8px}
  .stat__note{color:var(--mute);font-size:17px}
  .stat:first-child .stat__value{color:var(--acc)}

  /* 섹션 머리 */
  .sec{padding-top:clamp(64px,9vw,128px)}
  .sec__head{border-top:6px solid var(--ink);padding-top:18px;row-gap:10px;margin-bottom:clamp(28px,4vw,48px)}
  .sec__no{font-size:clamp(3.6rem,10vw,8.5rem);font-weight:800;line-height:.82;letter-spacing:-.06em;color:var(--acc)}
  .sec h2,.contact h2{font-size:clamp(1.75rem,3.5vw,3rem);line-height:1.22;font-weight:800;letter-spacing:-.03em}
  .lead{margin-top:16px;font-size:clamp(18px,1.6vw,21px);line-height:1.7;max-width:44em}
  .foot{color:var(--mute);font-size:16px;line-height:1.65;margin-top:18px}
  h3{font-size:clamp(1.3rem,2vw,1.6rem);line-height:1.3;font-weight:800;letter-spacing:-.02em}

  /* 미니멀 표 */
  table{width:100%;border-collapse:collapse}
  thead th{font-size:16px;font-weight:700;text-align:left;vertical-align:bottom;padding:10px 14px 10px 0;border-bottom:3px solid var(--ink)}
  tbody th,tbody td{text-align:left;vertical-align:top;padding:16px 14px 16px 0;border-bottom:1px solid var(--ink);font-size:18px}
  tbody th{font-weight:700}
  tbody tr:last-child th,tbody tr:last-child td{border-bottom:3px solid var(--ink)}
  td.is-acc{color:var(--acc);font-weight:800}
  tr.is-key th,tr.is-key td{font-size:clamp(19px,1.8vw,23px);font-weight:800}
  td .sub{display:block;font-size:16px;font-weight:500;color:var(--mute)}
  td .v{display:block}

  .save{margin-top:clamp(28px,4vw,48px);border-top:2px solid var(--ink);padding-top:12px;row-gap:4px;align-items:start}
  .save__label{padding-top:8px}
  .save__label{font-weight:700;font-size:19px}
  .save__value{font-size:clamp(2.6rem,8vw,6.4rem);font-weight:800;line-height:1;letter-spacing:-.045em}

  /* 회수 기간 막대 */
  .pb__grp{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--gap);row-gap:8px;padding:20px 0;border-top:1px solid var(--ink)}
  .pb__grp:last-child{border-bottom:3px solid var(--ink)}
  .pb__t{font-size:clamp(2.4rem,5vw,4.2rem);font-weight:800;line-height:1;letter-spacing:-.04em}
  .pb__t span{font-size:.42em;letter-spacing:0;margin-left:4px}
  .pb__bars{display:grid;gap:10px;align-content:center}
  .pb__row{display:grid;grid-template-columns:5.6em minmax(0,1fr);align-items:center;column-gap:12px;min-height:44px;font-size:18px}
  .pb__lab{font-weight:700}
  .pb__track{display:flex;align-items:center;gap:12px;--rv:8.5em}
  .pb__bar{display:block;height:38px;width:calc((100% - var(--rv)) * var(--w));flex:none}
  .pb__bar--old{border:3px solid var(--ink);background:#fff}
  .pb__bar--new{background:var(--acc)}
  .pb__val{font-size:clamp(21px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .pb__row--new .pb__val{color:var(--acc)}
  .points{counter-reset:pt;margin-top:clamp(28px,4vw,44px)}
  .points li{counter-increment:pt;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:12px;padding:16px 0;border-top:1px solid var(--ink);font-size:clamp(18px,1.6vw,20px)}
  .points li:last-child{border-bottom:1px solid var(--ink)}
  .points li::before{content:counter(pt);font-weight:800;color:var(--acc);font-size:1.3em;line-height:1.3}
  .pb__table{margin-top:clamp(36px,5vw,56px)}

  /* 과금 방식: 큰 번호 목록 */
  .bill li{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--gap);padding:22px 0 26px;border-top:2px solid var(--ink)}
  .bill li:last-child{border-bottom:6px solid var(--ink)}
  .bill__no{font-size:clamp(4rem,10vw,8rem);font-weight:800;line-height:.85;letter-spacing:-.06em;color:var(--acc)}
  .bill__title{font-size:clamp(1.7rem,3.6vw,3rem);font-weight:800;line-height:1.18;letter-spacing:-.035em}
  .bill__body{margin-top:10px;font-size:clamp(18px,1.6vw,21px);max-width:40em}

  /* 상생 구조 */
  .steps{row-gap:0}
  .step{border-top:6px solid var(--ink);padding:16px 0 28px}
  .step:nth-child(2){border-top-color:var(--acc)}
  .step__no{font-weight:700;font-size:18px}
  .step__no b{display:inline-block;margin-right:6px;font-size:clamp(3.4rem,7vw,6rem);line-height:.9;font-weight:800;letter-spacing:-.05em;color:var(--acc);margin-bottom:10px}
  .step h3{margin-bottom:8px}
  .pair{margin-top:clamp(36px,5vw,56px);row-gap:36px}
  .rule-list li{padding:14px 0;border-top:1px solid var(--ink);font-size:clamp(18px,1.6vw,20px)}
  .rule-list li:last-child{border-bottom:1px solid var(--ink)}
  .pair h3{padding-bottom:12px;border-bottom:3px solid var(--ink)}
  .pair h3 + .rule-list li:first-child{border-top:0}
  .support{margin-top:clamp(40px,5vw,64px);row-gap:16px}
  .support__list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--gap)}
  .support__list li{border-top:3px solid var(--ink);padding:12px 0 22px;font-size:clamp(19px,1.9vw,24px);font-weight:700;line-height:1.4}
  .trust{margin-top:clamp(36px,5vw,56px);font-size:clamp(20px,2.2vw,28px);font-weight:600;line-height:1.55;letter-spacing:-.015em;border-top:1px solid var(--ink);padding-top:18px}

  /* 200대 한정 */
  .ex{margin-top:clamp(36px,5vw,56px)}
  .ex h3{margin-bottom:8px}
  .ex__row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--gap);align-items:end;padding:16px 0 18px;border-top:1px solid var(--ink)}
  .ex__row:last-child{border-bottom:3px solid var(--ink)}
  .ex__n{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .ex__n span{display:block;font-size:17px;font-weight:600;letter-spacing:0}
  .ex__v{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px}
  .ex__v b{font-size:clamp(2.6rem,7.6vw,6.2rem);font-weight:800;line-height:1;letter-spacing:-.045em}
  .ex__v span{font-weight:700;font-size:19px}
  .ex__bar{display:block;height:10px;background:var(--acc);margin-top:12px;width:calc(100% * var(--w))}
  .ex__row:first-child .ex__v b{color:var(--acc)}

  /* 계산기: 흰 바탕, 검정 선, 선택 칩만 포인트 색 */
  #mp-calc .mpc{font-size:18px;gap:28px}
  #mp-calc .mpc__label{color:var(--ink);font-size:17px}
  #mp-calc .mpc__chip{border-radius:0;border:2px solid var(--ink);min-width:84px;min-height:56px;font-size:20px}
  #mp-calc .mpc__chip:hover{border-color:var(--acc)}
  #mp-calc .mpc__chip--on{background:var(--acc);border-color:var(--acc);color:#fff}
  #mp-calc .mpc__stepper button,#mp-calc .mpc__stepper input{border-radius:0;border:2px solid var(--ink);height:56px}
  #mp-calc .mpc__stepper button{width:56px}
  #mp-calc .mpc__stepper span.t{color:var(--ink);font-size:17px}
  #mp-calc .mpc__hero{border-radius:0;border-top:6px solid var(--ink);padding:14px 0 0;background:#fff;color:var(--ink)}
  #mp-calc .mpc__hero-label{font-size:18px;opacity:1}
  #mp-calc .mpc__hero-value{color:var(--acc);font-size:clamp(2.8rem,8vw,5.6rem);letter-spacing:-.045em;line-height:1.02}
  #mp-calc .mpc__hero-sub{font-size:18px;opacity:1;font-weight:700}
  #mp-calc .mpc__rows{border:0;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);border-radius:0;background:#fff}
  #mp-calc .mpc__row{padding:14px 0;border-top:1px solid var(--ink);gap:2px 16px}
  #mp-calc .mpc__row:first-child{border-top:0}
  #mp-calc .mpc__row--key{background:#fff}
  #mp-calc .mpc__row dd{font-size:20px}
  #mp-calc .mpc__row small{font-size:16px;color:var(--mute)}
  #mp-calc .mpc__save2{border-left:6px solid var(--acc);padding:4px 0 4px 14px;font-size:19px}
  #mp-calc .mpc__store{border-top:6px solid var(--ink);padding-top:14px}
  #mp-calc .mpc__store-title{font-size:clamp(1.3rem,2vw,1.6rem)}
  #mp-calc .mpc__seg{border-radius:0;border:2px solid var(--ink)}
  #mp-calc .mpc__seg-btn{min-height:52px;font-size:19px;padding:0 24px}
  #mp-calc .mpc__seg-btn + .mpc__seg-btn{border-left:2px solid var(--ink)}
  #mp-calc .mpc__seg-btn--on{background:var(--acc);color:#fff}
  #mp-calc .mpc__note{font-size:16px;color:var(--mute);border-top:1px solid var(--ink);padding-top:14px}
  @media (min-width:1024px){
    #mp-calc .mpc{grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:calc(var(--gap) * 2);align-items:start}
    #mp-calc .mpc__group,#mp-calc .mpc__note{grid-column:1/-1}
    #mp-calc .mpc__result{grid-column:1;grid-row:2}
    #mp-calc .mpc__store{grid-column:2;grid-row:2}
    #mp-calc .mpc:has(.mpc__store[style*="none"]) .mpc__result{grid-column:1/-1}
  }

  /* 계산 기준 */
  .basis li{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--ink);font-size:18px;counter-increment:bs}
  .basis{counter-reset:bs}
  .basis li::before{content:counter(bs);font-weight:800;color:var(--acc)}
  .basis li:last-child{border-bottom:3px solid var(--ink)}
  .notice{margin-top:28px;border:3px solid var(--ink);padding:20px 22px;font-size:17px;line-height:1.75}
  .notice p + p{margin-top:10px}

  /* 상담: 포인트 색 띠 */
  .contact{margin-top:clamp(72px,10vw,140px);background:var(--acc);color:#fff}
  .contact .wrap{padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(48px,6vw,88px)}
  .contact .sec__head{border-top-color:#fff}
  .contact .sec__no{color:#fff}
  .contact :focus-visible{outline-color:#fff}
  .tel{display:inline-block;text-decoration:none;color:#fff;margin-top:clamp(24px,4vw,40px);min-height:44px}
  .tel__label{display:block;font-weight:700;font-size:19px}
  .tel__num{display:block;font-size:clamp(3rem,14vw,8.6rem);font-weight:800;line-height:1.18;letter-spacing:-.04em;border-bottom:6px solid #fff;padding-bottom:4px}
  .contact .btn{flex-wrap:wrap;column-gap:8px;padding-top:8px;padding-bottom:8px;margin-top:28px;background:transparent;color:#fff;border-color:#fff}
  .contact .btn:hover{background:#fff;color:var(--acc)}
  .contact .lead{max-width:40em}

  .nw{white-space:nowrap}
  footer .wrap{padding-top:22px;padding-bottom:40px}
  footer p{font-size:16px;color:var(--mute);border-top:6px solid var(--ink);padding-top:14px}

  /* 태블릿 이상 */
  @media (min-width:768px){
    .sec__no{grid-column:1/3}
    .sec__title{grid-column:3/-1}
    .stat{grid-column:span 4}
    .stat + .stat{border-left:1px solid var(--ink);padding-left:var(--gap)}
    .step{grid-column:span 4}
    .pair>div{grid-column:span 6}
    .hero__sub{grid-column:1/8}
    .actions{grid-column:8/-1;flex-direction:column;align-items:stretch}
    .save__label{grid-column:1/4}
    .save__value{grid-column:4/-1}
  }
  /* PC: 비대칭 12단 (왼쪽 3단은 번호와 라벨, 오른쪽 9단은 본문) */
  @media (min-width:1024px){
    .sec__no{grid-column:1/4}
    .sec__title{grid-column:4/-1}
    .hero h1{grid-column:1/11}
    .body9{grid-column:4/-1}
    .support__title{grid-column:1/4}
    .support__list{grid-column:4/-1;grid-template-columns:repeat(4,minmax(0,1fr))}
    .trust{grid-column:4/-1}
  }
  /* 휴대폰: 표를 카드형으로 쌓는다 */
  @media (max-width:767px){
    .hero__sub{font-size:19px}
    .actions .btn{flex:1 1 100%}
    .stat{padding-bottom:18px}
    table,tbody,tr,th,td{display:block;width:100%}
    thead{display:none}
    tbody tr{border-top:3px solid var(--ink);padding:12px 0 6px}
    tbody tr:last-child{border-bottom:3px solid var(--ink)}
    tbody th,tbody td,tbody tr:last-child th,tbody tr:last-child td{border-bottom:0;padding:0}
    tbody th{font-size:20px;font-weight:800;padding-bottom:6px}
    tbody td,tbody tr:last-child td{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--soft)}
    tbody td::before{content:attr(data-label);font-size:16px;font-weight:600;color:var(--mute)}
    tbody td>*{grid-column:2}
    td .v,td .sub{text-align:right}
    tbody td{text-align:right}
    tbody td::before{text-align:left}
    tr.is-key th,tr.is-key td{font-size:20px}
    .pb__grp{grid-template-columns:1fr}
    .pb__row{grid-template-columns:4.8em minmax(0,1fr);font-size:17px}
    .pb__track{--rv:5.4em;gap:8px}
    .pb__bar{height:32px}
    .bill li{grid-template-columns:auto minmax(0,1fr);column-gap:16px}
    .bill__no{font-size:3.6rem;min-width:.62em}
    #mp-calc .mpc__chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    #mp-calc .mpc__chip{min-width:0}
    .ex__row{grid-template-columns:1fr;row-gap:6px}
    .ex__n span{display:inline;margin-left:4px}
  }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F7A5C'/%3E%3C/svg%3E">
</head>
<body>
<header class="top wrap">
  <div class="top__in">
    <span class="brand" data-bind="brand"></span>
    <a class="btn" href="#contact" data-bind="hero.ctaSecondary"></a>
  </div>
</header>

<main>
<section class="hero wrap" id="top" aria-labelledby="h-hero">
  <div class="g">
    <p class="badge" data-bind="hero.badge"></p>
    <h1 id="h-hero" data-bind="hero.title"></h1>
  </div>
  <div class="hero__big">
    <p class="hero__biglabel" data-bind="compare.saveLabel"></p>
    <p class="hero__bignum" data-v="save8"></p>
  </div>
  <div class="g hero__row">
    <p class="hero__sub" data-bind="hero.sub"></p>
    <div class="actions">
      <a class="btn btn--acc" href="#calc" data-bind="hero.ctaPrimary"></a>
      <a class="btn" href="#contact" data-bind="hero.ctaSecondary"></a>
    </div>
  </div>
  <div class="g stats" id="stats"></div>
</section>

<section class="sec wrap" id="compare" aria-labelledby="h-compare">
  <div class="g sec__head">
    <p class="sec__no" aria-hidden="true">01</p>
    <div class="sec__title"><h2 id="h-compare" data-bind="compare.title"></h2><p class="lead" data-bind="compare.lead"></p></div>
  </div>
  <div class="g">
    <div class="body9"><table id="t-compare"></table></div>
  </div>
  <div class="g save">
    <p class="save__label" data-bind="compare.saveLabel"></p>
    <p class="save__value" data-v="save8"></p>
  </div>
  <div class="g"><p class="foot body9" data-bind="compare.foot"></p></div>
</section>

<section class="sec wrap" id="payback" aria-labelledby="h-payback">
  <div class="g sec__head">
    <p class="sec__no" aria-hidden="true">02</p>
    <div class="sec__title"><h2 id="h-payback" data-bind="payback.title"></h2><p class="lead" data-bind="payback.lead"></p></div>
  </div>
  <div id="bars"></div>
  <div class="g"><ol class="points body9" id="points"></ol></div>
  <div class="pb__table"><table id="t-payback"></table></div>
  <div class="g"><p class="foot body9" data-bind="payback.foot"></p></div>
</section>

<section class="sec wrap" id="billing" aria-labelledby="h-billing">
  <div class="g sec__head">
    <p class="sec__no" aria-hidden="true">03</p>
    <div class="sec__title"><h2 id="h-billing" data-bind="billing.title"></h2><p class="lead" data-bind="billing.lead"></p></div>

<section class="sec wrap" id="partners" aria-labelledby="h-partners">
  <div class="g sec__head">

  </div>
  <div class="g steps" id="steps"></div>
  <div class="g pair">
    <div><h3 data-bind="partnership.owner.title"></h3><ul class="rule-list" id="owner"></ul></div>
    <div><h3 data-bind="partnership.hq.title"></h3><ul class="rule-list" id="hq"></ul></div>
  </div>
  <div class="g support">
    <h3 class="support__title" data-bind="partnership.support.title"></h3>
    <ul class="support__list" id="support"></ul>
  </div>
  <div class="g"><p class="trust" data-bind="partnership.trust"></p></div>
</section>

<section class="sec wrap" id="limited" aria-labelledby="h-limited">
  <div class="g sec__head">
    <p class="sec__no" aria-hidden="true">05</p>
    <div class="sec__title"><h2 id="h-limited" data-bind="limited.title"></h2><p class="lead" data-bind="limited.lead"></p></div>
  </div>
  <div class="g"><div class="body9"><table id="t-limited"></table></div></div>
  <div class="ex">
    <h3 data-bind="limited.examplesTitle"></h3>

<script src="../shared/model.js"></script>
<script src="../shared/content.js"></script>
<script src="../shared/widget.js"></script>
<script>
(function () {
  var C = MP.copyR, T = MP.TABLES, F = MP.fmt;
  function $(id) { return document.getElementById(id); }
  // 선만 있는 표. acc: 포인트 색 열 번호, key: 강조 행 번호
  function table(el, headers, rows, acc, key) {
    acc = acc || [];
    var h = '<thead><tr>' + headers.map(function (x) { return '<th scope="col">' + x + '</th>'; }).join('') + '</tr></thead>';
    var b = '<tbody>' + rows.map(function (r, ri) {
      return '<tr' + (ri === key ? ' class="is-key"' : '') + '>' + r.map(function (x, i) {
        return i === 0 ? '<th scope="row">' + x + '</th>'
          : '<td data-label="' + headers[i] + '"' + (acc.indexOf(i) >= 0 ? ' class="is-acc"' : '') + '>' + x + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
    el.innerHTML = h + b;
  }
  function list(el, items) { el.innerHTML = items.map(function (x) { return '<li>' + x + '</li>'; }).join(''); }

  MP.bind();

  $('stats').innerHTML = C.stats.map(function (s) {
    return '<div class="stat"><p class="stat__label">' + s.label + '</p><b class="stat__value">' + s.value + '</b><p class="stat__note">' + s.note + '</p></div>';
  }).join('');

  table($('t-compare'), C.compare.headers, T.compare, [2], 3);

  // 회수 기간: 가장 긴 값을 100%로 한 굵은 단색 막대
  var max = Math.max.apply(null, T.payback.map(function (r) { return Math.max(r.bepLegacy, r.bepNew); }));
  $('bars').innerHTML = T.payback.map(function (r) {
    return '<div class="pb__grp"><p class="pb__t">' + r.turns + '<span>회전</span></p><div class="pb__bars">' +
      '<div class="pb__row"><span class="pb__lab">일시불</span><div class="pb__track"><i class="pb__bar pb__bar--old" style="--w:' + (r.bepLegacy / max).toFixed(4) + '"></i><span class="pb__val">' + F.months(r.bepLegacy) + '</span></div></div>' +
      '<div class="pb__row pb__row--new"><span class="pb__lab">파트너스</span><div class="pb__track"><i class="pb__bar pb__bar--new" style="--w:' + (r.bepNew / max).toFixed(4) + '"></i><span class="pb__val">' + F.months(r.bepNew) + '</span></div></div>' +
      '</div></div>';
  }).join('');
  list($('points'), C.payback.points);
  // 월 순수익 칸에 일시불 방식 값을 함께 적어 일시불이 더 많다는 사실을 그대로 보여 준다
  table($('t-payback'), C.payback.headers, T.payback.map(function (r) {
    return [r.turns + '회전', F.man(r.revenue),
      '<span class="v">' + F.man(r.profitNew) + '</span><span class="sub">일시불 ' + F.man(r.profitLegacy) + '</span>',
      F.months(r.bepNew), F.months(r.bepLegacy), F.pct(r.roiNew)];
  }), [3, 5]);

  $('bill').innerHTML = C.billing.items.map(function (it, i) {
    return '<li><p class="bill__no" aria-hidden="true">' + (i + 1) + '</p><div><h3 class="bill__title">' + it.title + '</h3><p class="bill__body">' + it.body + '</p></div></li>';
  }).join('');

  $('steps').innerHTML = C.partnership.steps.map(function (s, i) {
    return '<div class="step"><p class="step__no"><b>' + (i + 1) + '</b>단계</p><h3>' + s.title + '</h3><p>' + s.body + '</p></div>';
  }).join('');
  list($('owner'), C.partnership.owner.items); list($('hq'), C.partnership.hq.items); list($('support'), C.partnership.support.items);

  table($('t-limited'), C.limited.headers, C.limited.rows, [1]);
  var ex = [8, 10, 20].map(function (n) { return { n: n, v: MP.discount(n).saveVsAfter }; });
  var exMax = Math.max.apply(null, ex.map(function (e) { return e.v; }));
  $('examples').innerHTML = ex.map(function (e) {
    return '<div class="ex__row"><p class="ex__n">' + e.n + '대<span>구매</span></p><div><p class="ex__v"><b>' + F.man(e.v) + '</b><span>할인</span></p><i class="ex__bar" style="--w:' + (e.v / exMax).toFixed(4) + '"></i></div></div>';
  }).join('');

  list($('basis-items'), C.basis.items);
  $('notice').innerHTML = C.basis.notice.map(function (x) { return '<p>' + x + '</p>'; }).join('');

  $('tel-label').textContent = C.cta.phoneLabel; $('tel-num').textContent = MP.contact.phone; $('cta-tel').href = MP.contact.tel;
  $('cta-site').innerHTML = '<span>' + C.cta.siteLabel + '</span> <span class="nw">' + MP.contact.site + '</span>'; $('cta-site').href = MP.contact.url;
  MP.mountCalc($('mp-calc'));
})();
</script>
</body>
</html>
