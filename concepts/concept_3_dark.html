<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>마이파크 파트너스 200 제안 (다크 대시보드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    color-scheme: dark;
    --bg:#060A13; --bg2:#0A1120; --panel:rgba(148,190,255,.055); --panel2:rgba(148,190,255,.085);
    --line:rgba(186,214,255,.17); --line2:rgba(186,214,255,.28);
    --fg:#F2F6FB; --fg2:#D3DDEA; --muted:#BFCBDA;
    --em:#34D399; --em2:#10B981; --cy:#67E8F9; --cy2:#22D3EE; --legacy:#8FA0BA;
    --ink:#03140E;
    --r:20px;
    --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    /* 계산기 */
    --mpc-fg:var(--fg); --mpc-muted:var(--muted); --mpc-bg:transparent; --mpc-card:#0D1628; --mpc-line:rgba(186,214,255,.22);
    --mpc-accent:#34D399; --mpc-accent-fg:#03140E;
    --mpc-hero-bg:linear-gradient(120deg,#34D399 0%,#2DD4BF 55%,#67E8F9 100%); --mpc-hero-fg:#03140E;
    --mpc-radius:16px; --mpc-font:var(--font); --mpc-num-font:var(--font);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;background-color:var(--bg);color:var(--fg);font:400 17px/1.7 var(--font);word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;position:relative}
  /* 은은한 빛 번짐 (글자 뒤 고정 층) */
  .glow{position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(520px 520px at 0% 0%,rgba(16,185,129,.30),transparent 70%),radial-gradient(520px 520px at 100% 560px,rgba(34,211,238,.20),transparent 70%),
      radial-gradient(640px 640px at 30% 2800px,rgba(16,185,129,.13),transparent 70%),radial-gradient(600px 600px at 100% 4700px,rgba(34,211,238,.13),transparent 70%);background-repeat:no-repeat}
  .grid-bg{position:absolute;inset:0 0 auto 0;height:900px;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(186,214,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(186,214,255,.05) 1px,transparent 1px);
    background-size:48px 48px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
  header,main,footer{position:relative;z-index:1}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  a{color:var(--cy)}
  :focus-visible{outline:3px solid var(--cy);outline-offset:3px;border-radius:8px}

  /* 상단 바 */
  .top{position:relative;z-index:20;background:rgba(6,10,19,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.06rem;color:var(--fg)}
  .brand .mark{width:30px;height:30px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--em),var(--cy2));box-shadow:0 0 18px rgba(52,211,153,.5);position:relative}
  .brand .mark::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg);left:10px;top:10px}

  /* 버튼 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:14px;font-weight:800;font-size:1.06rem;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-align:center;line-height:1.3}
  .btn--pri{background:linear-gradient(120deg,var(--em) 0%,#2DD4BF 60%,var(--cy) 100%);color:var(--ink);box-shadow:0 8px 30px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn--pri:hover{transform:translateY(-1px);box-shadow:0 12px 36px rgba(16,185,129,.5)}
  .btn--ghost{background:rgba(103,232,249,.07);color:var(--fg);border:1.5px solid rgba(103,232,249,.55)}
  .btn--ghost:hover{background:rgba(103,232,249,.15)}
  .btn--sm{min-height:48px;padding:0 18px;font-size:1rem}

  /* 공통 패널 */
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 50px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}
  .panel-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;color:var(--fg2);margin:0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--em);box-shadow:0 0 0 4px rgba(52,211,153,.18),0 0 12px var(--em);flex:none}
  .dot--cy{background:var(--cy);box-shadow:0 0 0 4px rgba(103,232,249,.16),0 0 12px var(--cy)}

  main>section.wrap{padding-top:96px}
  main>section.hero{padding-top:64px}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem;color:var(--cy);letter-spacing:.02em;margin-bottom:14px}
  .eyebrow::before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--em),var(--cy));border-radius:2px}
  h1,h2,h3{margin:0;color:var(--fg);letter-spacing:-.02em}
  h2{font-size:clamp(1.65rem,3.6vw,2.4rem);line-height:1.32;font-weight:800;max-width:24em}
  h3{font-size:1.2rem;line-height:1.4;font-weight:800}
  .lead{color:var(--fg2);font-size:1.08rem;margin:16px 0 0;max-width:46em}
  .foot{color:var(--muted);font-size:.95rem;margin:16px 0 0;line-height:1.65}
  .sec-head{margin-bottom:32px}

  /* 히어로 */
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:999px;font-weight:700;font-size:1rem;
    color:#B9F8DF;background:rgba(16,185,129,.12);border:1px solid rgba(52,211,153,.45)}
  .hero h1{font-size:clamp(2.05rem,4.9vw,3.55rem);line-height:1.24;font-weight:800;margin:22px 0 0;letter-spacing:-.03em}
  .hero h1 .hl{background:linear-gradient(100deg,var(--em),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .hero .sub{color:var(--fg2);font-size:1.12rem;margin:20px 0 0;max-width:34em}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

  .save-panel{padding:24px}
  .save-label{font-weight:700;color:var(--fg2);font-size:1rem}
  .save-value{font-size:clamp(2.3rem,5vw,3.4rem);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:6px 0 22px;color:var(--em);text-shadow:0 0 30px rgba(52,211,153,.35)}
  .mbar{display:grid;gap:8px;margin-top:16px}
  .mbar-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}
  .mbar-top span:first-child{color:var(--fg2)}
  .mbar-top b{font-weight:800}
  .mbar-track{height:16px;border-radius:999px;background:rgba(186,214,255,.08);overflow:hidden}
  .mbar-fill{height:100%;border-radius:999px;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  .mbar-fill.old{background:var(--legacy)}
  .mbar-fill.new{background:linear-gradient(90deg,var(--em2),var(--cy));box-shadow:0 0 16px rgba(52,211,153,.55)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
  .stat{padding:22px 24px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--em),transparent)}
  .stat:nth-child(2)::before{background:linear-gradient(90deg,var(--cy),transparent)}
  .stat-l{font-weight:700;color:var(--fg2);font-size:1rem}
  .stat-v{font-size:clamp(2rem,3.6vw,2.7rem);font-weight:800;line-height:1.15;letter-spacing:-.02em;color:var(--fg)}
  .stat-n{color:var(--muted);font-size:.98rem}

  /* 표 */
  .tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:1.02rem}
  .tbl th,.tbl td{padding:16px 20px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
  .tbl thead th{border-top:0;color:var(--fg2);font-weight:700;font-size:.98rem;background:rgba(186,214,255,.05)}
  .tbl tbody th{font-weight:700;color:var(--fg)}
  .tbl td{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
  .tbl .c-new{background:rgba(16,185,129,.08);color:#A7F3D0;font-weight:800}
  .tbl thead .c-new{color:#A7F3D0;background:rgba(16,185,129,.14)}
  .tbl tr.key th,.tbl tr.key td{font-size:1.14rem;font-weight:800}
  .tbl tr.key td.c-new{color:var(--em)}
  .tbl td.c-diff{color:var(--cy);font-weight:800}
  .tbl-box{overflow:hidden}

  .kpi-strip{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding:20px 24px;margin-bottom:18px;
    border-color:rgba(52,211,153,.4);background:linear-gradient(100deg,rgba(16,185,129,.16),rgba(34,211,238,.06))}
  .kpi-strip span{font-weight:700;color:var(--fg2);font-size:1.06rem}
  .kpi-strip b{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;color:var(--em);line-height:1.15}

  /* 회수 기간 */
  .pb-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:stretch}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;font-size:1rem}
  .legend span{display:inline-flex;align-items:center;gap:8px;color:var(--fg2)}
  .legend i{width:22px;height:12px;border-radius:4px;display:inline-block}
  .legend .lg-new{background:linear-gradient(90deg,var(--em2),var(--cy))}
  .legend .lg-old{background:var(--legacy)}
  .chart-body{padding:14px 22px 20px}
  #chart svg{display:block;width:100%;height:auto;overflow:visible}
  #chart text{font-family:var(--font);font-variant-numeric:tabular-nums}
  .insights{padding:6px 0;display:flex}
  .insights ol{list-style:none;margin:0;padding:0;counter-reset:pt;display:flex;flex-direction:column;flex:1}
  .insights li{flex:1;align-content:center}
  .insights li{counter-increment:pt}
  .insights li .ix::before{content:counter(pt)}
  .insights li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px 22px;border-top:1px solid var(--line);color:var(--fg)}
  .insights li:first-child{border-top:0}
  .insights li .ix{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:1rem;color:var(--ink);background:linear-gradient(135deg,var(--em),var(--cy))}
  .insights li:last-child .ix{background:#FCD34D}
  .insights li:last-child{background:rgba(252,211,77,.06)}


  /* 과금 방식 */
  .bill-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .bill{padding:24px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(180px 180px at 100% 0%,rgba(34,211,238,.14),transparent 70%),linear-gradient(180deg,var(--panel2),var(--panel))}
  .bill--zero{border-color:rgba(52,211,153,.55);background:radial-gradient(200px 200px at 100% 0%,rgba(52,211,153,.25),transparent 70%),linear-gradient(160deg,rgba(16,185,129,.2),rgba(16,185,129,.04) 70%)}
  .bill-top{display:flex;align-items:center;gap:12px}
  .bill-ix{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:800;color:var(--ink);background:linear-gradient(135deg,var(--em),var(--cy))}
  .bill-line{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(103,232,249,.6),transparent)}
  .bill-t{font-size:clamp(1.3rem,2vw,1.5rem);line-height:1.35;color:var(--fg)}
  .bill--zero .bill-t{color:var(--em)}
  .bill-b{margin:0;color:var(--fg2)}

  /* 상생 구조 */
  .flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;position:relative}
  .flow::before{content:"";position:absolute;left:12%;right:12%;top:44px;height:2px;background:linear-gradient(90deg,var(--em),var(--cy),var(--em));opacity:.7;z-index:0}
  .step{padding:24px;position:relative;z-index:1;background:linear-gradient(180deg,#0E1A2E,#0A1322)}
  .step-n{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:999px;font-weight:800;font-size:1rem;
    color:var(--ink);background:linear-gradient(120deg,var(--em),var(--cy));box-shadow:0 0 22px rgba(52,211,153,.4)}
  .step h3{margin:18px 0 8px;font-size:1.24rem}
  .step p{margin:0;color:var(--fg2)}
  .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
  .duo .panel{padding:0}
  .ul{list-style:none;margin:0;padding:6px 0}
  .ul li{position:relative;padding:14px 22px 14px 50px;border-top:1px solid var(--line)}
  .ul li:first-child{border-top:0}
  .ul li::before{content:"";position:absolute;left:24px;top:24px;width:10px;height:10px;border-radius:3px;background:var(--em);box-shadow:0 0 10px rgba(52,211,153,.6)}
  .ul--cy li::before{background:var(--cy);box-shadow:0 0 10px rgba(103,232,249,.6)}
  .support{margin-top:20px;padding:0}
  .chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px 22px 22px;list-style:none;margin:0}
  .chips li{padding:16px 18px;border-radius:14px;background:rgba(103,232,249,.07);border:1px solid rgba(103,232,249,.3);font-weight:700;line-height:1.5}
  .trust{margin-top:20px;padding:22px 24px 22px 26px;border-left:4px solid var(--em);font-size:1.08rem;color:var(--fg);font-weight:600}

  /* 한정 조건 */
  .ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
  .ex{padding:22px 24px}
  .ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ex-n{font-weight:800;font-size:1.15rem}
  .ex-tag{font-weight:700;font-size:.95rem;color:var(--ink);background:var(--em);border-radius:999px;padding:3px 12px}
  .ex-v{font-size:clamp(2rem,3.6vw,2.6rem);font-weight:800;color:var(--em);line-height:1.2;margin:12px 0 14px;letter-spacing:-.02em}
  .ex dl{margin:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
  .ex dl div{display:flex;justify-content:space-between;gap:12px}
  .ex dt{color:var(--fg2);font-weight:600}
  .ex dd{margin:0;font-weight:800}
  .ex-title{margin-top:40px;font-size:1.3rem}

  /* 계산기 */
  .calc-panel{padding:0;border-color:rgba(52,211,153,.35);box-shadow:0 0 0 1px rgba(52,211,153,.08),0 30px 80px rgba(0,0,0,.45),0 0 80px rgba(16,185,129,.08)}
  .calc-body{padding:26px}
  #mp-calc .mpc{font-size:17px}
  #mp-calc .mpc__label{color:var(--fg2)}
  #mp-calc .mpc__chip,#mp-calc .mpc__stepper button,#mp-calc .mpc__stepper input{background:#0D1628;color:var(--fg)}
  #mp-calc .mpc__chip--on{background:var(--em);color:var(--ink);box-shadow:0 0 18px rgba(52,211,153,.45)}
  #mp-calc .mpc__stepper input{color-scheme:dark}
  #mp-calc .mpc__hero{box-shadow:0 10px 40px rgba(16,185,129,.3)}
  #mp-calc .mpc__hero-label,#mp-calc .mpc__hero-sub{opacity:1;font-weight:700}
  #mp-calc .mpc__hero-value{font-variant-numeric:tabular-nums}
  #mp-calc .mpc__rows{background:#0B1424}
  #mp-calc .mpc__row dt{color:var(--fg)}
  #mp-calc .mpc__row small{color:var(--muted);font-weight:500;font-size:15.5px}
  #mp-calc .mpc__row--key{background:rgba(16,185,129,.12)}
  #mp-calc .mpc__row--key dd{color:var(--em)}
  #mp-calc .mpc__save2{color:var(--cy);font-size:1.04rem}
  #mp-calc .mpc__store{border-top:2px dashed rgba(186,214,255,.22)}
  #mp-calc .mpc__seg{background:#0D1628;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
  #mp-calc .mpc__seg-btn{padding:0 4px;min-height:52px}
  #mp-calc .mpc__seg-btn{color:var(--fg)}
  #mp-calc .mpc__seg-btn--on{background:var(--em);color:var(--ink)}
  #mp-calc .mpc__note{color:var(--muted);font-size:16px}

  /* 계산 기준 */
  .basis-list{list-style:none;margin:0;padding:8px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .basis-list li{padding:16px 24px 16px 52px;position:relative;border-top:1px solid var(--line);color:var(--fg)}
  .basis-list li::before{content:"";position:absolute;left:26px;top:27px;width:8px;height:8px;border-radius:50%;background:var(--cy)}
  .basis-list li:nth-child(odd){border-right:1px solid var(--line)}
  .basis-list li:last-child{grid-column:1/-1;border-right:0}
  .notice{margin-top:20px;padding:22px 24px;border-color:rgba(252,211,77,.35);background:rgba(252,211,77,.05)}
  .notice p{margin:0;color:var(--fg2)}
  .notice p+p{margin-top:10px}

  .cta{padding:44px 36px;text-align:center;position:relative;overflow:hidden;border-color:rgba(52,211,153,.55);
    background:radial-gradient(120% 140% at 50% 0%,rgba(16,185,129,.26),rgba(10,17,32,.65) 65%)}
  .cta-tag{display:inline-flex;align-items:center;padding:6px 18px;border-radius:999px;font-weight:800;font-size:.98rem;color:var(--ink);background:linear-gradient(120deg,#FCD34D,#F59E0B)}
  .cta h2{margin:16px auto 0;max-width:22em;font-size:clamp(1.5rem,3.6vw,2.35rem);line-height:1.38}
  .cta h2 b{color:#FCD34D;font-weight:800}
  .cta h2 strong{color:var(--em);font-weight:800;display:inline-block}
  .cta p{color:var(--fg2);margin:14px auto 0;max-width:34em;font-size:1.05rem;line-height:1.65}
  footer{margin-top:64px;border-top:1px solid var(--line);padding:28px 0 44px;color:var(--fg);font-size:1.08rem;font-weight:800;text-align:center}


  /* 히어로 범위 안내 */
  .scope{display:flex;align-items:flex-start;gap:10px;margin:18px 0 0;padding:12px 16px;border-radius:14px;
    background:rgba(103,232,249,.07);border:1px solid rgba(103,232,249,.35);color:var(--fg);font-weight:600;max-width:34em}
  .scope::before{content:"";flex:none;width:8px;height:8px;margin-top:.62em;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
  .hero-num-l{font-weight:700;color:var(--fg2);font-size:1.02rem}
  .hero-num{font-size:clamp(2.4rem,4.2vw,3.4rem);font-weight:800;line-height:1.12;letter-spacing:-.02em;margin:6px 0 10px;color:var(--fg);text-shadow:0 0 30px rgba(103,232,249,.25)}
  .hero-save{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .hero-save span{font-weight:700;color:var(--fg2)}
  .hero-save b{font-size:1.5rem;font-weight:800;color:var(--em)}

  /* 주제 2: 기존 대 파트너스 */
  .vs-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0 18px;align-items:stretch}
  .vs-side{padding:34px 34px 30px;display:flex;flex-direction:column;border-radius:26px}
  .vs-legacy{background:linear-gradient(180deg,rgba(143,160,186,.14),rgba(143,160,186,.05));border-color:rgba(186,214,255,.3)}
  .vs-partners{background:radial-gradient(420px 260px at 85% 0%,rgba(103,232,249,.22),transparent 70%),linear-gradient(170deg,rgba(16,185,129,.26),rgba(16,185,129,.06) 75%);
    border:1.5px solid rgba(52,211,153,.7);box-shadow:0 0 0 1px rgba(52,211,153,.15),0 30px 80px rgba(0,0,0,.45),0 0 90px rgba(16,185,129,.18)}
  .vs-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:1.06rem}
  .vs-legacy .vs-tag{background:rgba(143,160,186,.18);color:var(--fg);border:1px solid rgba(186,214,255,.35)}
  .vs-partners .vs-tag{background:var(--em);color:var(--ink)}
  .vs-k{margin-top:26px;font-weight:700;font-size:1.08rem;color:var(--fg2)}
  .vs-big{font-size:clamp(2.8rem,5.6vw,4.6rem);font-weight:800;line-height:1.08;letter-spacing:-.03em;margin-top:4px;color:var(--fg)}
  .vs-partners .vs-big{color:#6EE7B7;text-shadow:0 0 36px rgba(52,211,153,.45)}
  .vs-partners .vs-fee{color:var(--cy);text-shadow:0 0 36px rgba(103,232,249,.4)}
  .vs-note{margin-top:8px;color:var(--fg2);font-size:1.02rem;line-height:1.5}
  .vs-div{height:1px;margin:26px 0 0;background:linear-gradient(90deg,rgba(186,214,255,.35),transparent)}
  .vs-mid{display:flex;align-items:center;justify-content:center;position:relative}
  .vs-mid::before{content:"";position:absolute;top:10%;bottom:10%;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,rgba(103,232,249,.6),transparent)}
  .vs-mid span{position:relative;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;font-weight:800;font-size:1.06rem;color:var(--fg);
    background:#0B1424;border:1.5px solid rgba(103,232,249,.6);box-shadow:0 0 30px rgba(34,211,238,.3)}
  .vs-points{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:vp}
  .vs-points li{counter-increment:vp;padding:20px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
  .vs-points li::before{content:counter(vp);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--ink);background:linear-gradient(135deg,var(--em),var(--cy))}

  /* 태블릿 이하: 표를 카드로 */
  @media (max-width:900px){
    .hero-grid,.pb-grid{grid-template-columns:minmax(0,1fr)}
    .vs-wrap{grid-template-columns:minmax(0,1fr);gap:0}
    .vs-mid{height:84px}
    .vs-mid::before{top:0;bottom:0}
    .vs-big{font-size:clamp(2.6rem,8.5vw,4.2rem)}
    .vs-points{grid-template-columns:minmax(0,1fr)}
    .chips,.bill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tbl-box{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
    .tbl,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}
    .tbl thead{display:none}
    .tbl tbody{display:grid;gap:14px}
    .tbl tr{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel))}
    .tbl tbody th{padding:14px 18px;border-top:0;font-size:1.12rem;background:rgba(186,214,255,.06);border-bottom:1px solid var(--line)}
    .tbl td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 18px;border-top:1px solid var(--line);text-align:right}
    .tbl tbody th + td{border-top:0}
    .tbl td::before{content:attr(data-label);color:var(--fg2);font-weight:600;text-align:left;flex:0 0 auto}
    .tbl tr.key{border-color:rgba(52,211,153,.5)}
    .tbl tr.key th,.tbl tr.key td{font-size:1.06rem}
    .tbl .c-new{background:rgba(16,185,129,.1)}
  }
  @media (min-width:761px) and (max-width:1000px){
    .stat-v{font-size:1.35rem}
  }
  @media (max-width:760px){
    .stats,.duo,.flow,.bill-grid{grid-template-columns:minmax(0,1fr)}
    .flow::before{left:43px;right:auto;top:30px;bottom:30px;width:2px;height:auto;background:linear-gradient(180deg,var(--em),var(--cy))}
  }
  @media (max-width:560px){
    .wrap{padding:0 16px}
    main>section.wrap{padding-top:68px}
    main>section.hero{padding-top:32px}
    .top .wrap{min-height:62px}
    .brand{font-size:.98rem;gap:10px}
    .brand .mark{width:24px;height:24px;border-radius:7px}
    .brand .mark::after{width:8px;height:8px;left:8px;top:8px}
    .btn--sm{padding:0 14px}
    .cta-row .btn{width:100%}
    .panel-h{padding:14px 16px}
    .chips{grid-template-columns:minmax(0,1fr);padding:16px}
    .calc-body{padding:18px 16px}
    .cta{padding:32px 18px}
    .save-panel,.stat,.step{padding:20px}
    .ul li{padding:13px 16px 13px 42px}
    .ul li::before{left:18px;top:23px}
    .kpi-strip{padding:18px}
    .vs-side{padding:24px 20px 22px}
    .vs-points li{padding:16px}
    .scope{padding:12px 14px}
  }
  @media (min-width:1024px){
    #mp-calc .mpc>.mpc__result{grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:28px;align-items:stretch}
    #mp-calc .mpc .mpc__hero{grid-column:1;grid-row:1;align-content:center}
    #mp-calc .mpc .mpc__rows{grid-column:2;grid-row:1}
    #mp-calc .mpc .mpc__save2{grid-column:1/-1}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  .intro-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .intro-card{padding:22px 20px;display:grid;gap:8px;align-content:start}
  .intro-card .ix{width:34px;height:34px;border-radius:10px;background:rgba(16,185,129,.18);color:#6EE7B7;display:grid;place-items:center;font-weight:800}
  .intro-card h3{margin:0;font-size:1.2rem;line-height:1.35;color:#F2F6FB}
  .intro-card p{margin:0;color:var(--fg2);font-size:1.02rem;line-height:1.65}
  .intro-legacy{margin-top:16px;padding:18px 22px;font-size:1.05rem;line-height:1.7}
  @media (max-width:1000px){.intro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.intro-grid{grid-template-columns:minmax(0,1fr)}}
</style>
<meta name="description" content="스크린 파크골프 파트너스 창업 프로그램. 10대 기준 장비 대금 9,900만원, 기기 1대 990만원, 월 기기당 고정비 0원. 선착순 200대 한정 모집.">
<meta name="theme-color" content="#0F7A5C">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="마이파크 스크린 파크골프">
<meta property="og:title" content="마이파크 파트너스 창업 프로그램, 10대 기준 9,900만원">
<meta property="og:description" content="스크린 파크골프 파트너스 창업 프로그램. 10대 기준 장비 대금 9,900만원, 기기 1대 990만원, 월 기기당 고정비 0원. 선착순 200대 한정 모집.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F7A5C'/%3E%3C/svg%3E">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <span class="brand"><span class="mark" aria-hidden="true"></span><span data-bind="brand"></span></span>
    <a class="btn btn--ghost btn--sm" href="#calc" data-bind="hero.ctaPrimary"></a>
  </div>
</header>

<main>
<section class="wrap hero" id="top">
  <div class="hero-grid">
    <div>
      <span class="badge"><span class="dot" aria-hidden="true"></span><span data-bind="hero.badge"></span></span>
      <h1 id="hero-title"></h1>
      <p class="sub" data-bind="hero.sub"></p>
      <p class="scope" data-bind="hero.scope"></p>
      <div class="cta-row">
        <a class="btn btn--pri" href="#calc" data-bind="hero.ctaPrimary"></a>
        <a class="btn btn--ghost" href="#vs" data-bind="hero.ctaSecondary"></a>
      </div>
    </div>
    <div class="panel save-panel">
      <div class="hero-num-l" id="hero-num-l"></div>
      <div class="hero-num num" data-v="equipNew10"></div>
      <div id="hero-bars"></div>
      <div class="hero-save"><span data-bind="compare.saveLabel"></span><b class="num" data-bind="compare.saveValue"></b></div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</section>

<section class="wrap" id="intro">
  <div class="sec-head">
    <div class="eyebrow">파트너스란</div>
    <h2 data-bind="intro.title"></h2>
    <p class="lead" data-bind="intro.lead"></p>
  </div>
  <div class="intro-grid" id="intro-items"></div>
  <div class="panel intro-legacy"><span data-bind="intro.legacy"></span></div>
</section>

<section class="wrap" id="compare">
  <div class="sec-head">
    <div class="eyebrow">장비 대금</div>
    <h2 data-bind="compare.title"></h2>
    <p class="lead" data-bind="compare.lead"></p>
  </div>
  <div class="panel kpi-strip"><span data-bind="compare.saveLabel"></span><b class="num" data-bind="compare.saveValue"></b></div>
  <div class="panel tbl-box"><table class="tbl" id="t-compare"></table></div>
  <p class="foot" data-bind="compare.foot"></p>
</section>

<section class="wrap" id="vs">
  <div class="sec-head">
    <div class="eyebrow">비교</div>
    <h2>기기값과 매달 내는 비용이<br>이렇게 다릅니다</h2>
    <p class="lead" data-bind="vs.lead"></p>
  </div>
  <div class="vs-wrap" id="vs-box"></div>
  <ol class="vs-points" id="vs-points"></ol>
</section>

<section class="wrap" id="billing">
  <div class="sec-head">
    <div class="eyebrow">과금 방식</div>
    <h2 data-bind="billing.title"></h2>
    <p class="lead" data-bind="billing.lead"></p>
  </div>
  <div class="bill-grid" id="billing-items"></div>
</section>

<section class="wrap" id="partners">
  <div class="sec-head">
    <div class="eyebrow">상생 구조</div>
    <h2>본사도 매장 이용이 늘어야<br>수입이 늘어나는 구조입니다</h2>
    <p class="lead" data-bind="partnership.lead"></p>
  </div>
  <div class="flow" id="steps"></div>
  <div class="duo">
    <div class="panel"><div class="panel-h"><h3 class="panel-t"><span class="dot" aria-hidden="true"></span><span data-bind="partnership.owner.title"></span></h3></div><ul class="ul" id="owner"></ul></div>
    <div class="panel"><div class="panel-h"><h3 class="panel-t"><span class="dot dot--cy" aria-hidden="true"></span><span data-bind="partnership.hq.title"></span></h3></div><ul class="ul ul--cy" id="hq"></ul></div>
  </div>
  <div class="panel support"><div class="panel-h"><h3 class="panel-t"><span class="dot dot--cy" aria-hidden="true"></span><span data-bind="partnership.support.title"></span></h3></div><ul class="chips" id="support"></ul></div>
  <p class="panel trust" data-bind="partnership.trust"></p>
</section>

<section class="wrap" id="calc">
  <div class="sec-head">
    <div class="eyebrow">계산기</div>
    <h2 data-bind="calc.title"></h2>
    <p class="lead" data-bind="calc.lead"></p>
  </div>
  <div class="panel calc-panel">
    <div class="panel-h"><p class="panel-t"><span class="dot" aria-hidden="true"></span><span data-bind="brand"></span></p></div>
    <div class="calc-body"><div id="mp-calc"></div></div>
  </div>
</section>

<section class="wrap" id="point">
  <div class="panel cta">
    <span class="cta-tag" data-bind="point.tag"></span>
    <h2><b>초기 투자금은 대폭 낮추고</b><br><b>손익분기점</b>을 가장 빠르게<br>앞당기는 <strong>최적의 창업 방식</strong></h2>
    <p data-bind="point.desc"></p>
  </div>
</section>
</main>
<footer><div class="wrap" data-bind="footer"></div></footer>

<script src="../shared/model.js"></script>
<script src="../shared/content.js"></script>
<script src="../shared/widget.js"></script>
<script>
(function () {
  var C = MP.copyR, T = MP.TABLES, F = MP.fmt, V = MP.V;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // 표: 모바일 카드형을 위해 각 칸에 머리글을 data-label 로 붙인다
  function table(el, headers, rows, opt) {
    opt = opt || {};
    var cls = function (i) { return (opt.cols && opt.cols[i]) ? ' class="' + opt.cols[i] + '"' : ''; };
    var h = '<thead><tr>' + headers.map(function (x, i) { return '<th scope="col"' + cls(i) + '>' + esc(x) + '</th>'; }).join('') + '</tr></thead>';
    var b = '<tbody>' + rows.map(function (r, ri) {
      var key = opt.key && opt.key.indexOf(ri) >= 0 ? ' class="key"' : '';
      return '<tr' + key + '>' + r.map(function (x, i) {
        return i === 0 ? '<th scope="row">' + esc(x) + '</th>' : '<td' + cls(i) + ' data-label="' + esc(headers[i]) + '">' + esc(x) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
    el.innerHTML = h + b;
  }
  function list(el, items) { el.innerHTML = items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); }

  MP.bind();

  // 히어로 제목: 기준 대수 장비 대금만 빛나게 (스마트폰 줄바꿈 균형)
  var title = C.hero.title, k = title.indexOf(V.equipNew10), h1 = $('hero-title');
  if (k >= 0) {
    var prefix = title.slice(0, k).replace(', ', '<br>');
    h1.innerHTML = prefix + '<span class="hl num">' + esc(V.equipNew10) + '</span>' + esc(title.slice(k + V.equipNew10.length));
  } else h1.textContent = title;

  // 히어로 장비 대금 막대 (기준 대수)
  var d = MP.discount(MP.P.baseUnits);
  $('hero-num-l').textContent = C.stats[0].label;
  $('hero-bars').innerHTML = [
    { l: '기존 기기값', v: V.equipLegacy10, w: 1, c: 'old' },
    { l: '파트너스 방식', v: V.equipNew10, w: d.partners / d.legacy, c: 'new' }
  ].map(function (b) {
    return '<div class="mbar"><div class="mbar-top"><span>' + b.l + '</span><b class="num">' + esc(b.v) + '</b></div>' +
      '<div class="mbar-track"><div class="mbar-fill ' + b.c + '" style="width:' + (b.w * 100).toFixed(2) + '%"></div></div></div>';
  }).join('');

  $('stats').innerHTML = C.stats.map(function (s) {
    return '<div class="panel stat"><span class="stat-l">' + esc(s.label) + '</span><b class="stat-v num">' + esc(s.value) + '</b><span class="stat-n">' + esc(s.note) + '</span></div>';
  }).join('');

  table($('t-compare'), C.compare.headers, T.compare, { cols: [null, null, 'c-new', 'c-diff'],
    key: T.compare.map(function (r, i) { return r[0] === C.stats[0].label ? i : -1; }) });

  // 주제 2: 두 큰 패널 (스마트폰 2줄 대칭 줄맞춤)
  function side(o, cls) {
    var noteHtml = esc(o.feeNote).replace(', ', '<br>');
    return '<div class="panel vs-side ' + cls + '"><span class="vs-tag">' + esc(o.tag) + '</span>' +
      '<div class="vs-k">' + esc(o.priceNote) + '</div><div class="vs-big num">' + esc(o.price) + '</div>' +
      '<div class="vs-div" aria-hidden="true"></div>' +
      '<div class="vs-k">' + esc(o.feeTitle) + '</div><div class="vs-big vs-fee num">' + esc(o.fee) + '</div>' +
      '<div class="vs-note">' + noteHtml + '</div></div>';
  }
  $('vs-box').innerHTML = side(C.vs.legacy, 'vs-legacy') + '<div class="vs-mid"><span>' + esc(C.vs.mid) + '</span></div>' + side(C.vs.partners, 'vs-partners');
  $('vs-points').innerHTML = C.vs.points.map(function (p) { return '<li class="panel"><span>' + esc(p) + '</span></li>'; }).join('');

  $('intro-items').innerHTML = C.intro.items.map(function (it, i) { return '<div class="panel intro-card"><span class="ix num" aria-hidden="true">' + (i + 1) + '</span><h3>' + esc(it.title) + '</h3><p>' + esc(it.body) + '</p></div>'; }).join('');
  $('billing-items').innerHTML = C.billing.items.map(function (it, i) {
    return '<article class="panel bill' + (i === 0 ? ' bill--zero' : '') + '"><div class="bill-top"><span class="bill-ix num" aria-hidden="true">' + (i + 1) + '</span><span class="bill-line" aria-hidden="true"></span></div>' +
      '<h3 class="bill-t">' + esc(it.title) + '</h3><p class="bill-b">' + esc(it.body) + '</p></article>';
  }).join('');

  $('steps').innerHTML = C.partnership.steps.map(function (s, i) {
    return '<div class="panel step"><span class="step-n">' + (i + 1) + '단계</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p></div>';
  }).join('');
  list($('owner'), C.partnership.owner.items); list($('hq'), C.partnership.hq.items); list($('support'), C.partnership.support.items);

  MP.mountCalc($('mp-calc'));
})();
</script>
</body>
</html>
